zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 784576545c19437eac38b7203b48acb6
    name: Templates/Network devices
  templates:
  - uuid: c41e202d2eee4c21a623792115647185
    template: Securepoint UTM Standalone v5.6 by SNMP
    name: Securepoint UTM Standalone v5.6 by SNMP
    description: 'Experimental unified manufacturer-MIB SNMPv3 monitoring with selected standard network/system checks and graphs. Origin: Securepoint 2025-05-27 MIB + legacy template
      observations. NO hrStorage/hrDevice scans or zero-divisor formulas. Optional features stay disabled. No SNMP credentials, sensitive VPN endpoints or user-session inventory. Offline
      validated only; live UTM/Zabbix testing pending. Standalone v5.6: no inherited generic SNMP parent; all IF-MIB monitoring provided locally.'
    vendor:
      name: Northnetone (local integration, vendor MIB definitions)
      version: 8.0-5.6
    groups:
    - name: Templates/Network devices
    tags:
    - tag: class
      value: network
    - tag: target
      value: securepoint-utm
    - tag: source
      value: securepoint-official-mib
    items:
    - uuid: 7112a5ae8b384606a204be4e4ed8f57e
      name: 'UTM: Product name'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.1.1]
      key: sp.mib.product.name
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: comProdName, SECUREPOINT-MIB
      tags:
      - tag: component
        value: inventory
    - uuid: 82f92dd3336f4b07a5bb1baf4e7aa653
      name: 'UTM: Current firmware version'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.1.2.7]
      key: sp.mib.firmware.current
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: comVerCur from official SECUREPOINT-MIB; previous template omitted scalar .0 suffix.
      tags:
      - tag: component
        value: firmware
    - uuid: 44f781b94df141f1ad7130f99ca35f01
      name: 'UTM: New firmware version reported'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.1.2.8]
      key: sp.mib.firmware.new
      delay: 2h
      value_type: CHAR
      trends: '0'
      description: 'comVerNew: vendor-reported new version, not necessarily currently installed.'
      tags:
      - tag: component
        value: firmware
      triggers:
      - uuid: fcd7e68758c548a7a845737f27edc017
        expression: '{$SP.FIRMWARE.ALERT}=1 and nodata(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.firmware.current,1d)=0 and nodata(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.firmware.new,1d)=0 and find(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.firmware.current,,"regexp","[0-9]+[.][0-9]+")=1 and find(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.firmware.new,,"regexp","[0-9]+[.][0-9]+")=1 and last(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.firmware.current)<>last(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.firmware.new)'
        name: 'UTM: firmware update reported by manufacturer'
        priority: WARNING
        description: 'Manufacturer-reported new firmware differs from installed; verify that an update is appropriate in the UTM UI. A string difference does not imply version precedence.'
        tags:
        - tag: scope
          value: maintenance
        - tag: component
          value: firmware

    - uuid: 4cb4bae19f424fd9a867e889b2ec6899
      name: 'UTM: License type'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.1.3.3]
      key: sp.mib.license.type
      delay: 6h
      value_type: CHAR
      trends: '0'
      description: comLicType
      tags:
      - tag: component
        value: license
    - uuid: 7ea044aa02b047baa4e277e614d10a76
      name: 'UTM: Licensed maximum users'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.1.3.4]
      key: sp.mib.license.users.max
      delay: 6h
      description: comLicUsersMax
      tags:
      - tag: component
        value: license
    - uuid: 5896d1c29fc646d6a99ca28e00645c72
      name: 'UTM: License days remaining'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.1.3.5]
      key: sp.mib.license.days
      delay: 6h
      units: d
      description: comLicDaysLeft; alert is OPT-IN because licensing models can differ.
      tags:
      - tag: component
        value: license
      triggers:
      - uuid: 70cf7448da5742dca2a49a48c4278b1c
        expression: '{$SP.LICENSE.ALERT}=1 and nodata(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.license.days,1d)=0 and last(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.license.days)<={$SP.LICENSE.WARN.DAYS} and last(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.license.days)>{$SP.LICENSE.CRIT.DAYS}'
        name: 'UTM: license expires within {$SP.LICENSE.WARN.DAYS} days'
        priority: WARNING
        description: 'Upcoming renewal: remaining days above critical and at or below warning threshold. Validate per license type.'
        tags:
        - tag: scope
          value: maintenance
        - tag: component
          value: license
      - uuid: 355a48198cff4a6dab8e3d4d9767bd91
        expression: '{$SP.LICENSE.ALERT}=1 and nodata(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.license.days,1d)=0 and last(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.license.days)>0 and last(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.license.days)<={$SP.LICENSE.CRIT.DAYS}'
        name: 'UTM: license expires within {$SP.LICENSE.CRIT.DAYS} days'
        priority: HIGH
        description: 'Urgent renewal: remaining days are positive and at or below critical threshold. Alert action configuration is separate.'
        tags:
        - tag: scope
          value: maintenance
        - tag: component
          value: license
      - uuid: 0b8b351efa304c5aa5251bce986ef12a
        expression: '{$SP.LICENSE.ALERT}=1 and nodata(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.license.days,1d)=0 and {$SP.LICENSE.ZERO.IS.EXPIRED}=1 and last(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.license.days)=0'
        name: 'UTM: license reports zero days remaining'
        priority: HIGH
        description: 'Optional: activate only where zero days unambiguously means expired; some license models may use zero differently.'
        tags:
        - tag: scope
          value: maintenance
        - tag: component
          value: license

    - uuid: 6515b1ffa27f41dfa81866dba503b52b
      name: 'UTM: Connection tracking table maximum'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.2.1.10.1]
      key: sp.mib.conntrack.maximum
      delay: 3m
      description: Linux nf_conntrack_max as exposed by manufacturer MIB.
      tags:
      - tag: component
        value: conntrack
    - uuid: 7519f5f23be54a8ea4b7fc1ef5ed200a
      name: 'UTM: Connection tracking table current'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.2.1.10.2]
      key: sp.mib.conntrack.current
      delay: 3m
      description: Linux nf_conntrack_count as exposed by manufacturer MIB.
      tags:
      - tag: component
        value: conntrack
      triggers:
      - uuid: f7201e2268ef4d62a02ed9c6c9d58b86
        expression: '{$SP.CONNTRACK.ALERT}=1 and last(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.conntrack.maximum)>0 and min(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.conntrack.current,10m)>0.85*last(/Securepoint
          UTM Unified v5 by SNMP/sp.mib.conntrack.maximum)'
        name: 'UTM: conntrack table over 85%'
        priority: WARNING
        description: No division by zero; alert opt-in.
        tags:
        - tag: scope
          value: capacity
