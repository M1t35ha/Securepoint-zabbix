    macros:
    - macro: '{$SP.FIRMWARE.ALERT}'
      value: '1'
      description: Opt-out if vendor reported new firmware does not represent updates on this firewall.
    - macro: '{$SP.LICENSE.WARN.DAYS}'
      value: '30'
      description: Calendar days until license renewal warning.
    - macro: '{$SP.LICENSE.CRIT.DAYS}'
      value: '7'
      description: Calendar days until urgent license renewal.
    - macro: '{$SP.LICENSE.ZERO.IS.EXPIRED}'
      value: '0'
      description: 'Opt-in: treat zero remaining days as expired only after license semantics are verified.'
    - macro: '{$SP.DASHBOARD.IF.MATCHES}'
      value: '^(LAN.*|WAN.*|DMZ.*|VLAN.*|vlan.*|A[0-9].*|eth[0-9].*|en[opsx].*|wlan.*|wg[0-9].*|tun[0-9].*|tap[0-9].*|ppp.*|bond.*|br.*|bridge.*)$'
      description: Narrow IF-MIB traffic to typical active interface names; override at host if needed.
    - macro: '{$SP.SERVICE.ALERT}'
      value: '0'
      description: Opt in with context (e.g. {$SP.SERVICE.ALERT:"snmpd"}=1).
    - macro: '{$SP.IPSEC.ALERT}'
      value: '0'
      description: Opt in per always-on IPsec tunnel.
    - macro: '{$SP.WG.ALERT}'
      value: '0'
      description: Opt in per WireGuard interface name; expected to be always up.
    - macro: '{$SP.WG.PEER.ALERT}'
      value: '0'
      description: Opt in per always-on WireGuard peer name.
    - macro: '{$SP.AV.ALERT}'
      value: '0'
      description: Opt in per active AV product.
    - macro: '{$SP.LICENSE.ALERT}'
      value: '1'
      description: 0 until license days semantics are verified.
    - macro: '{$SP.CONNTRACK.ALERT}'
      value: '0'
      description: 0 until both conntrack scalar OIDs are confirmed.
    - macro: '{$SP.SNMP.NODATA.ALERT}'
      value: '1'
      description: 'Alert when no SNMP OS uptime is collected for 15 minutes.'
    - macro: '{$SP.IF.ALERT}'
      value: '0'
      description: 'Opt in by interface name: set {$SP.IF.ALERT:"LAN1"}=1 only for critical always-on interfaces.'
