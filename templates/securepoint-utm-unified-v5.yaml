          name: "OPTIONAL: HA sync state"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.2.1.12.4.0]"
          key: "sp.mib.ha.sync"
          delay: "10m"
          value_type: "CHAR"
          trends: "0"
          status: "DISABLED"
          tags:
            -
              tag: "component"
              value: "ha"
        -
          uuid: "8ded1d95e09043a088617feb556305ce"
          name: "OPTIONAL: HA maintenance"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.2.1.12.5.0]"
          key: "sp.mib.ha.maintenance"
          delay: "10m"
          value_type: "CHAR"
          trends: "0"
          status: "DISABLED"
          tags:
            -
              tag: "component"
              value: "ha"
        -
          uuid: "4ed5cbf2bf0e497d80f1036c4df00477"
          name: "OPTIONAL: Linux load 1m"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.2021.10.1.3.1]"
          key: "sp.mib.linux.load1"
          delay: "3m"
          value_type: "FLOAT"
          status: "DISABLED"
          tags:
            -
              tag: "component"
              value: "cpu"
        -
          uuid: "4ad5c5a6bb0e43318cf0fd2049effe2b"
          name: "OPTIONAL: Linux load 5m"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.2021.10.1.3.2]"
          key: "sp.mib.linux.load5"
          delay: "3m"
          value_type: "FLOAT"
          status: "DISABLED"
          tags:
            -
              tag: "component"
