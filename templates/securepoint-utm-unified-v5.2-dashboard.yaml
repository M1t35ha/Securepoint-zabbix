      params: 100*(last(//sp.dashboard.mem.total_kib)-last(//sp.dashboard.mem.free_kib))/(last(//sp.dashboard.mem.total_kib)+1)
      units: '%'
      description: Optional dashboard-only derived metric. Requires both underlying UCD SNMP scalar items to be supported. Not a Securepoint vendor OID.
      tags:
      - tag: component
        value: dashboard
    - uuid: 47bcd5041550405da570449d5d4f0a7f
      name: 'Dashboard: host uptime (system HR)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.25.1.1.0]
      key: sp.dashboard.uptime
      delay: 5m
      units: uptime
      description: hrSystemUptime TimeTicks; multiplied by 0.01 to seconds, may reset independently from interface uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: dashboard
    - uuid: 0182faaad600475aafa2459a76e2af3a
      name: 'Dashboard: firewall hostname'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: sp.dashboard.system.name
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: Standard MIB-II scalar; safe system identity fallback when optional vendor firmware OID is missing.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: dashboard
    - uuid: 6a2db94d29634b27a6c946b98914760f
      name: 'Dashboard: firewall system description'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: sp.dashboard.system.description
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: Standard MIB-II scalar; safe system identity fallback when optional vendor firmware OID is missing.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: dashboard
    discovery_rules:
    - uuid: 6c21d066c0c6420f98dad51c519e583e
      name: 'UTM MIB: system services'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.1.1.1.2]
      key: sp.mib.service.discovery
      delay: 1h
      description: appStatusTable, auto-discovers service names and known states.
      item_prototypes:
      - uuid: 572fb22bc6334e728923d663ea438386
        name: 'Service {#LABEL}: state'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.1.1.1.3.{#SNMPINDEX}]
        key: sp.mib.service.status[{#SNMPINDEX}]
        delay: 5m
        description: appStatus from official MIB.
        tags:
        - tag: component
          value: service
        - tag: item
          value: '{#LABEL}'
        valuemap:
          name: Securepoint application (MIB)
        trigger_prototypes:
        - uuid: 43eaa27164174f46b9276f1e8f641284
          expression: '{$SP.SERVICE.ALERT:"{#LABEL}"}=1 and min(/Securepoint UTM Unified v5 by SNMP/sp.mib.service.status[{#SNMPINDEX}],10m)=2'
          name: 'UTM: required service {#LABEL} is DOWN'
          priority: WARNING
          description: Opt in per service; status 2=Down, intentional disabled services should not be alerted.
          tags:
          - tag: scope
            value: availability
      - uuid: 1ac4a8c6e0fe493ea1f03b72e942d98c
        name: 'Service {#LABEL}: raw flags'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.1.1.1.4.{#SNMPINDEX}]
        key: sp.mib.service.flags[{#SNMPINDEX}]
        delay: 15m
        description: appFlags Unsigned32. Meaning of individual flags is not documented; no decoding.
        tags:
        - tag: component
          value: service
        - tag: item
          value: '{#LABEL}'
    - uuid: 3f94a55b03764a38997dfebdee312195
      name: 'UTM MIB: IPsec tunnels'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.2.1.1.2]
      key: sp.mib.ipsec.discovery
      delay: 1h
      description: ipsecStatusTable; status 0/1/2 mapped per manufacturer MIB.
      item_prototypes:
      - uuid: bb5877496a984228806943e69cca107d
        name: 'IPsec {#LABEL}: tunnel status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.2.1.1.3.{#SNMPINDEX}]
        key: sp.mib.ipsec.status[{#SNMPINDEX}]
        delay: 3m
        tags:
        - tag: component
          value: ipsec
        - tag: item
          value: '{#LABEL}'
        valuemap:
          name: Securepoint IPsec (MIB)
        trigger_prototypes:
        - uuid: ec7277dc972243fdb8b6ab685d26f0ee
          expression: '{$SP.IPSEC.ALERT:"{#LABEL}"}=1 and min(/Securepoint UTM Unified v5 by SNMP/sp.mib.ipsec.status[{#SNMPINDEX}],10m)=2'
          name: 'UTM: required IPsec {#LABEL} is DOWN'
          priority: WARNING
          description: Opt in per IPsec profile; on-demand profiles may correctly be down.
          tags:
          - tag: scope
            value: availability
      - uuid: 6d73ed0f03b240ce87eecd1f60968d28
        name: 'IPsec {#LABEL}: configured subnet count'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.2.1.1.4.{#SNMPINDEX}]
        key: sp.mib.ipsec.subnets[{#SNMPINDEX}]
        delay: 15m
        tags:
        - tag: component
          value: ipsec
        - tag: item
          value: '{#LABEL}'
    - uuid: f4436783308d4a9a888b681e426fd8f1
      name: 'UTM MIB: OpenVPN profiles'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.3.1.1.2]
      key: sp.mib.openvpn.discovery
      delay: 1h
      description: openvpnStatusTable. Connection counts available; per-user session inventory not collected.
      item_prototypes:
      - uuid: 5ce37455274241a38319ac9fb1d20562
        name: 'OpenVPN {#LABEL}: status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.3.1.1.3.{#SNMPINDEX}]
        key: sp.mib.openvpn.status[{#SNMPINDEX}]
        delay: 5m
        tags:
        - tag: component
          value: openvpn
        - tag: item
          value: '{#LABEL}'
        valuemap:
          name: Securepoint OpenVPN (MIB)
      - uuid: 165e811fdd6844a3a1417a31f668c190
        name: 'OpenVPN {#LABEL}: connected clients'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.3.1.1.4.{#SNMPINDEX}]
        key: sp.mib.openvpn.clients[{#SNMPINDEX}]
        delay: 5m
        tags:
        - tag: component
          value: openvpn
        - tag: item
          value: '{#LABEL}'
      graph_prototypes:
      - uuid: 29e25ff97b2d4ba4b31cd710faa71fa6
        name: 'OpenVPN {#LABEL}: active client count'
        graph_items:
        - sortorder: '0'
          color: 1A7D33
          item:
            host: Securepoint UTM Unified v5 by SNMP
            key: sp.mib.openvpn.clients[{#SNMPINDEX}]
    - uuid: e2850249b0c34cef92633192c2d393ac
      name: 'UTM MIB: antivirus engines'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.5.1.1.2]
      key: sp.mib.av.discovery
      delay: 1h
      description: Manufacturer MIB table discovery; only creates items for returned rows.
      item_prototypes:
      - uuid: 71cf08fdad824e5f96fa71836382bb03
        name: 'Antivirus {#LABEL}: last pattern update'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.5.1.1.3.{#SNMPINDEX}]
        key: sp.mib.av.lastupdate[{#SNMPINDEX}]
        delay: 30m
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: av
        - tag: item
          value: '{#LABEL}'
      - uuid: c7613466ea314707a641643672ba1b2a
        name: 'Antivirus {#LABEL}: last updater run'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.5.1.1.4.{#SNMPINDEX}]
        key: sp.mib.av.lastrun[{#SNMPINDEX}]
        delay: 30m
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: av
        - tag: item
          value: '{#LABEL}'
      - uuid: 06caea7fe3794e0481e51a8ae534c7ff
        name: 'Antivirus {#LABEL}: pattern update state'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.5.1.1.5.{#SNMPINDEX}]
        key: sp.mib.av.state[{#SNMPINDEX}]
        delay: 10m
        tags:
        - tag: component
          value: av
        - tag: item
          value: '{#LABEL}'
        valuemap:
          name: Securepoint antivirus update (MIB)
        trigger_prototypes:
        - uuid: 50904920f1d740109b22e444544d365d
          expression: '{$SP.AV.ALERT:"{#LABEL}"}=1 and min(/Securepoint UTM Unified v5 by SNMP/sp.mib.av.state[{#SNMPINDEX}],20m)=2'
          name: 'UTM: antivirus {#LABEL} pattern update FAILED'
          priority: WARNING
          description: Opt in per active AV engine.
          tags:
          - tag: scope
            value: availability
    - uuid: 6c03862a06194b3085f736eb2f3dec1d
      name: 'UTM MIB: WireGuard interfaces'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.11.1.1.2]
      key: sp.mib.wg.if.discovery
      delay: 1h
      description: Manufacturer MIB table discovery; only creates items for returned rows.
      item_prototypes:
      - uuid: 5f020703963c458a9762c8130bbf337f
        name: 'WireGuard {#LABEL}: configured tunnel name'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.1.1.3.{#SNMPINDEX}]
        key: sp.mib.wg.interface.tunnelname[{#SNMPINDEX}]
        delay: 30m
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
      - uuid: 3bd93a6da48d4b6da73ee9a07684d7f7
        name: 'WireGuard {#LABEL}: status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.1.1.4.{#SNMPINDEX}]
        key: sp.mib.wg.interface.status[{#SNMPINDEX}]
        delay: 5m
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
        valuemap:
          name: Securepoint WireGuard (MIB)
        trigger_prototypes:
        - uuid: c442c75979944676ac7fd4d40766c60e
          expression: '{$SP.WG.ALERT:"{#LABEL}"}=1 and min(/Securepoint UTM Unified v5 by SNMP/sp.mib.wg.interface.status[{#SNMPINDEX}],10m)=0'
          name: 'UTM: required WireGuard tunnel {#LABEL} disconnected'
          priority: WARNING
          description: Opt in only for tunnels expected to remain connected.
          tags:
          - tag: scope
            value: availability
      - uuid: b3e987c88f2f43b593a3547d6e72aba3
        name: 'WireGuard {#LABEL}: listen port'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.1.1.6.{#SNMPINDEX}]
        key: sp.mib.wg.interface.port[{#SNMPINDEX}]
        delay: 30m
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
      - uuid: 2605195bb46c4dc192a9f17786491189
        name: 'WireGuard {#LABEL}: peer count'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.1.1.7.{#SNMPINDEX}]
        key: sp.mib.wg.interface.peer_count[{#SNMPINDEX}]
        delay: 10m
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
    - uuid: 7000cb23d7a54ad081c0fd85d08e8865
      name: 'UTM MIB: WireGuard peers'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.11.2.1.2]
      key: sp.mib.wg.peer.discovery
      delay: 30m
      description: Manufacturer MIB table discovery; only creates items for returned rows.
      item_prototypes:
      - uuid: 9dc42baf9a774d70a2b3431341d41448
        name: 'WireGuard peer {#LABEL}: status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.2.1.3.{#SNMPINDEX}]
        key: sp.mib.wg.peer.status[{#SNMPINDEX}]
        delay: 5m
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
        valuemap:
          name: Securepoint WireGuard (MIB)
        trigger_prototypes:
        - uuid: 462856eec7de477db48470ce9f3f7c9a
          expression: '{$SP.WG.PEER.ALERT:"{#LABEL}"}=1 and min(/Securepoint UTM Unified v5 by SNMP/sp.mib.wg.peer.status[{#SNMPINDEX}],10m)=0'
          name: 'UTM: required WireGuard peer {#LABEL} disconnected'
          priority: WARNING
          description: Opt in only for peers expected to remain up; mobile peers may disconnect normally.
          tags:
          - tag: scope
            value: availability
      - uuid: d13ba0ec5bf743c8bbeab48ec6560b78
        name: 'WireGuard peer {#LABEL}: last handshake (raw vendor integer)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.2.1.6.{#SNMPINDEX}]
        key: sp.mib.wg.peer.handshake[{#SNMPINDEX}]
        delay: 5m
        description: MIB identifies this as time of latest handshake but does NOT specify Unix timestamp, age, or unit. Do not alarm or render as date until tested.
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
      - uuid: 42259bcad93d4441996b7a49aa981556
        name: 'WireGuard peer {#LABEL}: bytes sent'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.2.1.7.{#SNMPINDEX}]
        key: sp.mib.wg.peer.bytes.sent[{#SNMPINDEX}]
        delay: 3m
        units: B
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
      - uuid: f5f9784270fb49f9aa23d069c829a2c9
        name: 'WireGuard peer {#LABEL}: bytes received'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.2.1.8.{#SNMPINDEX}]
        key: sp.mib.wg.peer.bytes.received[{#SNMPINDEX}]
        delay: 3m
        units: B
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
      - uuid: ef7e6633fb8f4bb5ac1c97fe0afb4084
        name: 'WireGuard peer {#LABEL}: upload bytes/s'
        type: DEPENDENT
        key: sp.mib.wg.peer.bps.sent[{#SNMPINDEX}]
        value_type: FLOAT
        units: Bps
        master_item:
          key: sp.mib.wg.peer.bytes.sent[{#SNMPINDEX}]
        preprocessing:
        - type: CHANGE_PER_SECOND
        description: Byte/s from Counter64 delta; first sample will be empty. Monitor for counter reset/wrap anomalies on reboot. No VPN key or endpoint data stored.
        tags:
        - tag: component
          value: wireguard
      - uuid: ce4253716ddc4e92b35c973a31968dc4
        name: 'WireGuard peer {#LABEL}: download bytes/s'
        type: DEPENDENT
        key: sp.mib.wg.peer.bps.received[{#SNMPINDEX}]
        value_type: FLOAT
        units: Bps
        master_item:
          key: sp.mib.wg.peer.bytes.received[{#SNMPINDEX}]
        preprocessing:
        - type: CHANGE_PER_SECOND
        description: Byte/s from Counter64 delta; first sample will be empty. Monitor for counter reset/wrap anomalies on reboot. No VPN key or endpoint data stored.
        tags:
        - tag: component
          value: wireguard
      graph_prototypes:
      - uuid: 7de9f3d9200d4b1c9d51196e26697887
        name: 'WireGuard peer {#LABEL}: throughput (bytes/s)'
        graph_items:
        - sortorder: '0'
          color: 1A7D33
          item:
            host: Securepoint UTM Unified v5 by SNMP
            key: sp.mib.wg.peer.bps.received[{#SNMPINDEX}]
        - sortorder: '1'
          color: CB4B16
          item:
            host: Securepoint UTM Unified v5 by SNMP
            key: sp.mib.wg.peer.bps.sent[{#SNMPINDEX}]
    - uuid: 79451f1f65984d0787ec1d48654ff40b
      name: 'OPTIONAL: IPsec connection / subnet state'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.2.2.1.6]
      key: sp.mib.ipsec.subnet.discovery
      delay: 1h
      description: 'Composite indices: tunnel, subnet. Enable after confirming table supported.'
      item_prototypes:
      - uuid: baacfe77348e435f9f16f8def52551b4
        name: 'IPsec connection index {#SNMPINDEX}: subnet status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.2.2.1.6.{#SNMPINDEX}]
        key: sp.mib.ipsec.subnet.status[{#SNMPINDEX}]
        delay: 5m
        tags:
        - tag: component
          value: ipsec
        - tag: item
          value: '{#LABEL}'
        valuemap:
          name: Securepoint IPsec (MIB)
      status: DISABLED
    - uuid: 35606867fac24864b3c5b02c45f1f593
      name: 'OPTIONAL: configuration backup inventory'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.6.1.1.2]
      key: sp.mib.backup.discovery
      delay: 12h
      description: Backup IDs may change; data retention and LLD churn require review.
      item_prototypes:
      - uuid: 7eada3f9a143451bb37efb629e6a70e7
        name: 'Configuration backup {#LABEL}: created date'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.6.1.1.3.{#SNMPINDEX}]
        key: sp.mib.backup.date[{#SNMPINDEX}]
        delay: 12h
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: backup
        - tag: item
          value: '{#LABEL}'
      status: DISABLED
    - uuid: 1cbaa5924d0c4ca59ce91602eb359946
      name: 'OPTIONAL: HOST-RESOURCES per-core CPU'
      type: SNMP_AGENT
      snmp_oid: discovery[{#CPU_LOAD},1.3.6.1.2.1.25.3.3.1.2]
      key: sp.std.cpu.discovery
      delay: 1h
      description: hrProcessorLoad-only LLD. Unlike hrDevice/hrStorage, this narrowly discovers CPU utilisation. Enable after verifying hrProcessorLoad table.
      item_prototypes:
      - uuid: 7fa302f536344f128284d5b68e556e10
        name: 'CPU core {#SNMPINDEX}: utilisation'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.25.3.3.1.2.{#SNMPINDEX}]
        key: sp.std.cpu.util[{#SNMPINDEX}]
        delay: 2m
        units: '%'
        description: Average non-idle CPU usage over the last minute (HOST-RESOURCES-MIB hrProcessorLoad).
        tags:
        - tag: component
          value: cpu
      graph_prototypes:
      - uuid: c8ccea9f87b446f2b1f46351eecac3f7
        name: 'Securepoint UTM v5: CPU core {#SNMPINDEX} usage'
        graph_items:
        - sortorder: '0'
          drawtype: BOLD_LINE
          color: 199C0D
          item:
            host: Securepoint UTM Unified v5 by SNMP
            key: sp.std.cpu.util[{#SNMPINDEX}]
      status: DISABLED
    - uuid: 729eb23576df47a9a2ad65f9d71dbb95
      name: 'Dashboard: interface throughput by IF-MIB (64-bit)'
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1]
      key: sp.dashboard.interface.discovery
      delay: 1h
      description: Narrow discovery of IF-MIB interfaces for dashboard throughput. Two HC counter Items per interface; avoids hrStorage/hrDevice sweeps. Duplicate metrics from generic parent are deliberate for a template-owned dashboard.
      item_prototypes:
      - uuid: b8d4369ae4894cecaff914fe761c979c
        name: 'Dashboard interface {#IFNAME}: received bits/s'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: sp.dashboard.interface.in.bps[{#SNMPINDEX}]
        delay: 3m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface-traffic
      - uuid: 1e5ae39c24e64086aba56be8f3588a06
        name: 'Dashboard interface {#IFNAME}: transmitted bits/s'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: sp.dashboard.interface.out.bps[{#SNMPINDEX}]
        delay: 3m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface-traffic
      graph_prototypes:
      - uuid: 84464ad8e841407cade0f4a0cff894ac
        name: 'Interfaces: {#IFNAME} throughput (bps)'
        graph_items:
        - sortorder: '0'
          color: 0EC9AC
          item:
            host: Securepoint UTM Unified v5 by SNMP
            key: sp.dashboard.interface.in.bps[{#SNMPINDEX}]
        - sortorder: '1'
          color: 42A5F5
          item:
            host: Securepoint UTM Unified v5 by SNMP
            key: sp.dashboard.interface.out.bps[{#SNMPINDEX}]
    macros:
    - macro: '{$SP.SERVICE.ALERT}'
      value: '0'
      description: Opt in with context (e.g. {$SP.SERVICE.ALERT:"snmpd"}=1).
    - macro: '{$SP.IPSEC.ALERT}'
      value: '0'
      description: Opt in per always-on IPsec tunnel.
    - macro: '{$SP.WG.ALERT}'
      value: '0'
      description: Opt in per WireGuard interface name; expected to be always up.
    - macro: '{$SP.WG.PEER.ALERT}'
      value: '0'
      description: Opt in per always-on WireGuard peer name.
    - macro: '{$SP.AV.ALERT}'
      value: '0'
      description: Opt in per active AV product.
    - macro: '{$SP.LICENSE.ALERT}'
      value: '0'
      description: 0 until license days semantics are verified.
    - macro: '{$SP.CONNTRACK.ALERT}'
      value: '0'
      description: 0 until both conntrack scalar OIDs are confirmed.
