name: Securepoint RC validation
on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Validate the only supported RC template
        run: python tools/validate_template.py templates/securepoint-utm-standalone-v5.6.yaml
      - name: Test privacy-preserving SNMPwalk analyzer
        run: python -m unittest discover -s tests -v
      - name: Check current documentation links
        run: python tools/check_docs.py
