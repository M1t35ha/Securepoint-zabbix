          name: "OPTIONAL: HA sync state"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.2.1.12.4.0]"
          key: "sp.mib.ha.sync"
          delay: "10m"
          value_type: "CHAR"
          trends: "0"
          status: "DISABLED"
          tags:
            -
              tag: "component"
              value: "ha"
        -
          uuid: "1f4063a50fda4221a1cb76ddc2352fa9"
          name: "OPTIONAL: HA maintenance"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.2.1.12.5.0]"
          key: "sp.mib.ha.maintenance"
          delay: "10m"
          value_type: "CHAR"
          trends: "0"
          status: "DISABLED"
          tags:
            -
              tag: "component"
