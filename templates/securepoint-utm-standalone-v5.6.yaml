        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
    - uuid: 8b7fbe536d8844eba98b6d83c3a96f9b
      name: 'UTM MIB: WireGuard peers'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.11.2.1.2]
      key: sp.mib.wg.peer.discovery
      delay: 30m
      description: Manufacturer MIB table discovery; only creates items for returned rows.
      item_prototypes:
      - uuid: 19828bd8a6894370a91cf29ca7698a8c
        name: 'WireGuard peer {#LABEL}: status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.2.1.3.{#SNMPINDEX}]
        key: sp.mib.wg.peer.status[{#SNMPINDEX}]
        delay: 5m
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
        valuemap:
          name: Securepoint WireGuard (MIB)
        trigger_prototypes:
        - uuid: c161844813ad4db0aa715ac84d486c18
          expression: '{$SP.WG.PEER.ALERT:"{#LABEL}"}=1 and min(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.wg.peer.status[{#SNMPINDEX}],10m)=0'
          name: 'UTM: required WireGuard peer {#LABEL} disconnected'
          priority: WARNING
          description: Opt in only for peers expected to remain up; mobile peers may disconnect normally.
          tags:
          - tag: scope
            value: availability
      - uuid: 1b152b148ff0420ca7e14dc0f6511c38
        name: 'WireGuard peer {#LABEL}: last handshake (raw vendor integer)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.2.1.6.{#SNMPINDEX}]
        key: sp.mib.wg.peer.handshake[{#SNMPINDEX}]
        delay: 5m
        description: MIB identifies this as time of latest handshake but does NOT specify Unix timestamp, age, or unit. Do not alarm or render as date until tested.
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
      - uuid: 7e8e21998b954d59a149006d62c7891d
        name: 'WireGuard peer {#LABEL}: bytes sent'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.2.1.7.{#SNMPINDEX}]
        key: sp.mib.wg.peer.bytes.sent[{#SNMPINDEX}]
        delay: 3m
        units: B
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
      - uuid: 916bcea842ed40b4aebac7a03c181c9c
        name: 'WireGuard peer {#LABEL}: bytes received'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.2.1.8.{#SNMPINDEX}]
        key: sp.mib.wg.peer.bytes.received[{#SNMPINDEX}]
        delay: 3m
        units: B
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
      - uuid: 23d854fb56084c3fa45d2bfb6eccc86f
        name: 'WireGuard peer {#LABEL}: upload bytes/s'
        type: DEPENDENT
        key: sp.mib.wg.peer.bps.sent[{#SNMPINDEX}]
        value_type: FLOAT
        units: Bps
        master_item:
          key: sp.mib.wg.peer.bytes.sent[{#SNMPINDEX}]
        preprocessing:
        - type: CHANGE_PER_SECOND
        description: Byte/s from Counter64 delta; first sample will be empty. Monitor for counter reset/wrap anomalies on reboot. No VPN key or endpoint data stored.
        tags:
        - tag: component
          value: wireguard
      - uuid: f1c48b53feb94d67ab68a963af6a48bf
        name: 'WireGuard peer {#LABEL}: download bytes/s'
        type: DEPENDENT
        key: sp.mib.wg.peer.bps.received[{#SNMPINDEX}]
        value_type: FLOAT
        units: Bps
        master_item:
          key: sp.mib.wg.peer.bytes.received[{#SNMPINDEX}]
        preprocessing:
        - type: CHANGE_PER_SECOND
        description: Byte/s from Counter64 delta; first sample will be empty. Monitor for counter reset/wrap anomalies on reboot. No VPN key or endpoint data stored.
        tags:
        - tag: component
          value: wireguard
      graph_prototypes:
      - uuid: 92b1c467773e4b37a5f7bd9b78627583
        name: 'WireGuard peer {#LABEL}: throughput (bytes/s)'
        graph_items:
        - sortorder: '0'
          color: 1A7D33
          item:
            host: Securepoint UTM Standalone v5.6 by SNMP
            key: sp.mib.wg.peer.bps.received[{#SNMPINDEX}]
        - sortorder: '1'
          color: CB4B16
          item:
            host: Securepoint UTM Standalone v5.6 by SNMP
            key: sp.mib.wg.peer.bps.sent[{#SNMPINDEX}]
    - uuid: 31471c2478a14c8cabc63184c5ce118c
      name: 'OPTIONAL: IPsec connection / subnet state'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.2.2.1.6]
      key: sp.mib.ipsec.subnet.discovery
      delay: 1h
      description: 'Composite indices: tunnel, subnet. Enable after confirming table supported.'
      item_prototypes:
      - uuid: 74947cd832304b0ca4b0e0ccab187918
        name: 'IPsec connection index {#SNMPINDEX}: subnet status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.2.2.1.6.{#SNMPINDEX}]
        key: sp.mib.ipsec.subnet.status[{#SNMPINDEX}]
        delay: 5m
        tags:
        - tag: component
          value: ipsec
        - tag: item
          value: '{#LABEL}'
        valuemap:
