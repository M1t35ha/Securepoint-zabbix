              type: "SNMP_AGENT"
              snmp_oid: "get[1.3.6.1.4.1.28553.2.1.1.1.1.3.{#SNMPINDEX}]"
              key: "sp.mib.service.status[{#SNMPINDEX}]"
              delay: "5m"
              valuemap:
                name: "Securepoint application (MIB)"
              tags:
                -
                  tag: "component"
                  value: "service"
                -
                  tag: "name"
                  value: "{#LABEL}"
              trigger_prototypes:
                -
                  uuid: "c68ea82a64cc488b886ff8bcfda73565"
                  name: "UTM: required service {#LABEL} is down"
                  expression: "{$SP.SERVICE.ALERT:\"{#LABEL}\"}=1 and min(/Securepoint UTM MIB Mapped v4 by SNMP/sp.mib.service.status[{#SNMPINDEX}],10m)=2"
