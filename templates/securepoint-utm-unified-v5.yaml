# Experimental Securepoint MIB-mapped Zabbix template; test before production.
zabbix_export:
  version: "7.0"
  template_groups:
    -
      uuid: "784576545c19437eac38b7203b48acb6"
      name: "Templates/Network devices"
  templates:
    -
      uuid: "2b95f452af3848889e758df62ecd8365"
      template: "Securepoint UTM Unified v5 by SNMP"
      name: "Securepoint UTM Unified v5 by SNMP"
      description: "Experimental MIB-mapped Securepoint 14.x SNMPv3 template. Offline-validated only; verify on device. No hrDevice/hrStorage discovery, no swap division. Triggers opt-in. Manufacturer MIB files NOT included."
      vendor:
        name: "Community (unofficial)"
        version: "8.0-4"
      groups:
        -
          name: "Templates/Network devices"
      templates:
        -
          name: "Network Generic Device by SNMP"
      tags:
        -
          tag: "class"
          value: "network"
        -
          tag: "target"
          value: "securepoint-utm"
      items:
        -
          uuid: "750d821f59a14dea89f622b564551700"
          name: "UTM: Product name"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.1.1.0]"
          key: "sp.mib.product.name"
          delay: "1h"
          value_type: "CHAR"
          trends: "0"
          tags:
            -
              tag: "component"
              value: "inventory"
        -
          uuid: "e67fa39922b2466c854254cf761e35a2"
          name: "UTM: Current firmware version"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.1.2.7.0]"
          key: "sp.mib.firmware.current"
          delay: "1h"
          value_type: "CHAR"
          trends: "0"
          tags:
            -
              tag: "component"
              value: "firmware"
        -
          uuid: "ce9d543ae3534af38cce3500743dbef9"
          name: "UTM: New firmware version reported"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.1.2.8.0]"
          key: "sp.mib.firmware.new"
          delay: "2h"
          value_type: "CHAR"
          trends: "0"
          tags:
            -
              tag: "component"
              value: "firmware"
        -
          uuid: "0cff5a942dfb4a75873de08e913b45a7"
          name: "UTM: License type"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.1.3.3.0]"
          key: "sp.mib.license.type"
          delay: "6h"
          value_type: "CHAR"
          trends: "0"
          tags:
            -
              tag: "component"
              value: "license"
        -
          uuid: "d49361a02e68478781d31ee6b7f1e3cd"
          name: "UTM: Licensed maximum users"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.1.3.4.0]"
          key: "sp.mib.license.users.max"
          delay: "6h"
          tags:
            -
              tag: "component"
              value: "license"
        -
          uuid: "58e1ef5f20dd4eb2837587bd177dd518"
          name: "UTM: License days remaining"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.1.3.5.0]"
          key: "sp.mib.license.days"
          delay: "6h"
          units: "d"
          tags:
            -
              tag: "component"
              value: "license"
          triggers:
            -
              uuid: "d3337f40b5fc4dc189d4c1ba513cfd5b"
              name: "UTM: license under 30 days"
              expression: "{$SP.LICENSE.ALERT}=1 and last(/Securepoint UTM Unified v5 by SNMP/sp.mib.license.days)<30 and last(/Securepoint UTM Unified v5 by SNMP/sp.mib.license.days)>=7"
              priority: "WARNING"
            -
              uuid: "0d660ca6f668429187ef1954b9a33827"
              name: "UTM: license under 7 days"
              expression: "{$SP.LICENSE.ALERT}=1 and last(/Securepoint UTM Unified v5 by SNMP/sp.mib.license.days)<7"
              priority: "HIGH"
        -
          uuid: "d6a0a6c81b6c42b78bbd42fef487daa5"
          name: "UTM: Conntrack maximum"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.2.1.10.1.0]"
          key: "sp.mib.conntrack.maximum"
          delay: "3m"
          tags:
            -
              tag: "component"
              value: "conntrack"
        -
          uuid: "97e936e71ca349f086416995b5a23b4e"
          name: "UTM: Conntrack current"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.2.1.10.2.0]"
          key: "sp.mib.conntrack.current"
          delay: "3m"
          tags:
            -
              tag: "component"
              value: "conntrack"
          triggers:
            -
              uuid: "67f3f766781f476d8e8dfd3035b18aaf"
              name: "UTM: conntrack over 85%"
              expression: "{$SP.CONNTRACK.ALERT}=1 and last(/Securepoint UTM Unified v5 by SNMP/sp.mib.conntrack.maximum)>0 and min(/Securepoint UTM Unified v5 by SNMP/sp.mib.conntrack.current,10m)>0.85*last(/Securepoint UTM Unified v5 by SNMP/sp.mib.conntrack.maximum)"
              priority: "WARNING"
        -
          uuid: "1217977f389e44be8d0c6ab5488995bc"
          name: "OPTIONAL: HA cluster enabled"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.2.1.12.1.0]"
