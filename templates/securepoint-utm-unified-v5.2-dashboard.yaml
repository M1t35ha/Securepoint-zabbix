zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 784576545c19437eac38b7203b48acb6
    name: Templates/Network devices
  templates:
  - uuid: a9698c5941b640a6bb52c935fb398e6f
    template: Securepoint UTM Unified v5 by SNMP
    name: Securepoint UTM Unified v5 by SNMP
    description: 'Experimental unified manufacturer-MIB SNMPv3 monitoring with selected standard network/system checks and graphs. Origin: Securepoint 2025-05-27 MIB + legacy template
      observations. NO hrStorage/hrDevice scans or zero-divisor formulas. Optional features stay disabled. No SNMP credentials, sensitive VPN endpoints or user-session inventory. Offline
      validated only; live UTM/Zabbix testing pending.'
    vendor:
      name: Northnetone (local integration, vendor MIB definitions)
      version: 8.0-5
    groups:
    - name: Templates/Network devices
    templates:
    - name: Network Generic Device by SNMP
    tags:
    - tag: class
      value: network
    - tag: target
      value: securepoint-utm
    - tag: source
      value: securepoint-official-mib
    items:
    - uuid: 077057d7900e44e490cdc7f470ea70d1
      name: 'UTM: Product name'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.1.1]
      key: sp.mib.product.name
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: comProdName, SECUREPOINT-MIB
      tags:
      - tag: component
        value: inventory
    - uuid: 95cfa1ed8dff4a8aa4c15e25e67757cf
      name: 'UTM: Current firmware version'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.1.2.7]
      key: sp.mib.firmware.current
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: comVerCur from official SECUREPOINT-MIB; previous template omitted scalar .0 suffix.
      tags:
      - tag: component
        value: firmware
    - uuid: cebdf4b51fc44f659c099a36e69e0867
      name: 'UTM: New firmware version reported'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.1.2.8]
      key: sp.mib.firmware.new
      delay: 2h
      value_type: CHAR
      trends: '0'
      description: 'comVerNew: vendor-reported new version, not necessarily currently installed.'
      tags:
      - tag: component
        value: firmware
    - uuid: 73e76ffef3f044fb9a4a0e18d76ce6ca
      name: 'UTM: License type'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.1.3.3]
      key: sp.mib.license.type
      delay: 6h
      value_type: CHAR
      trends: '0'
      description: comLicType
      tags:
      - tag: component
        value: license
    - uuid: 8baa6f94b90b43fea3be846ee2998c4c
      name: 'UTM: Licensed maximum users'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.1.3.4]
      key: sp.mib.license.users.max
      delay: 6h
      description: comLicUsersMax
      tags:
      - tag: component
        value: license
    - uuid: e336a74f60df42af8fe16b1969549c1f
      name: 'UTM: License days remaining'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.1.3.5]
      key: sp.mib.license.days
      delay: 6h
      units: d
      description: comLicDaysLeft; alert is OPT-IN because licensing models can differ.
      tags:
      - tag: component
        value: license
      triggers:
      - uuid: be816ff3e9b04c16acf1974bcdb99a9e
        expression: '{$SP.LICENSE.ALERT}=1 and last(/Securepoint UTM Unified v5 by SNMP/sp.mib.license.days)<30 and last(/Securepoint UTM Unified v5 by SNMP/sp.mib.license.days)>=7'
        name: 'UTM: license expires in under 30 days'
        priority: WARNING
        description: Enable only if comLicDaysLeft is accurate for this license type.
        tags:
        - tag: scope
          value: availability
      - uuid: 21bba25e29ee4fa3bfb7200a875bf035
        expression: '{$SP.LICENSE.ALERT}=1 and last(/Securepoint UTM Unified v5 by SNMP/sp.mib.license.days)<7'
        name: 'UTM: license expires within a week'
        priority: HIGH
        description: Enable only after validating licensed days.
        tags:
        - tag: scope
          value: availability
    - uuid: 6048f82a2f244c53828eff8846b98741
      name: 'UTM: Connection tracking table maximum'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.2.1.10.1]
      key: sp.mib.conntrack.maximum
      delay: 3m
      description: Linux nf_conntrack_max as exposed by manufacturer MIB.
      tags:
      - tag: component
        value: conntrack
    - uuid: bc1207eb03e649c4889a34dc88a84ab9
      name: 'UTM: Connection tracking table current'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.2.1.10.2]
      key: sp.mib.conntrack.current
      delay: 3m
      description: Linux nf_conntrack_count as exposed by manufacturer MIB.
      tags:
      - tag: component
        value: conntrack
      triggers:
      - uuid: 3acd3b96ac83440ab9a078fbda0087b5
        expression: '{$SP.CONNTRACK.ALERT}=1 and last(/Securepoint UTM Unified v5 by SNMP/sp.mib.conntrack.maximum)>0 and min(/Securepoint UTM Unified v5 by SNMP/sp.mib.conntrack.current,10m)>0.85*last(/Securepoint
          UTM Unified v5 by SNMP/sp.mib.conntrack.maximum)'
        name: 'UTM: conntrack table over 85%'
        priority: WARNING
        description: No division by zero; alert opt-in.
        tags:
        - tag: scope
          value: capacity
    - uuid: be3951c95425493cbb7ccde2a450e7f8
      name: 'UTM: HA cluster enabled'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.28553.2.1.12.1]
      key: sp.mib.ha.enabled
      delay: 10m
      description: Official clusterStatusEnabled. Scalars use .0, unlike the previous raw diagnostics items.
      tags:
      - tag: component
        value: ha
      valuemap:
        name: Securepoint cluster enabled (MIB)
    - uuid: bc36f88e01b44108ab2c33ba418337e3
      name: 'UTM: HA role / priority (optional)'
      type: SNMP_AGENT
