        -
          uuid: "f1d3a36754594b3faa47abebf0a996b3"
          name: "OPTIONAL: Linux load 1m"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.2021.10.1.3.1]"
          key: "sp.mib.linux.load1"
          delay: "3m"
          value_type: "FLOAT"
          status: "DISABLED"
          tags:
            -
              tag: "component"
              value: "cpu"
        -
          uuid: "702825e1ff494c5da71b3041aa5d10bd"
          name: "OPTIONAL: Linux load 5m"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.2021.10.1.3.2]"
          key: "sp.mib.linux.load5"
          delay: "3m"
          value_type: "FLOAT"
          status: "DISABLED"
          tags:
