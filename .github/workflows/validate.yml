name: Template validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Offline structural validation
        run: |
          python tools/validate_template.py templates/securepoint-utm-mib-v4.yaml
          python tools/validate_template.py templates/securepoint-utm-unified-v5.yaml
          python tools/validate_template.py templates/securepoint-utm-unified-v5.1-dashboard.yaml
          python tools/validate_template.py templates/securepoint-utm-unified-v5.2-dashboard.yaml
          python tools/validate_template.py templates/securepoint-utm-unified-v5.3-dashboard.yaml
          python tools/validate_template.py templates/securepoint-utm-unified-v5.4-firmware-license.yaml
          python tools/validate_template.py templates/securepoint-utm-unified-v5.5-interfaces.yaml
      - name: Offline SNMPwalk parser tests (no device required)
        run: python -m unittest discover -s tests -v
