          delay: "3m"
          value_type: "FLOAT"
          status: "DISABLED"
          tags:
            -
              tag: "component"
              value: "cpu"
        -
          uuid: "e18fca450c144c588468451bf2d6b3e6"
          name: "OPTIONAL: Linux load 15m"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.2021.10.1.3.3]"
          key: "sp.mib.linux.load15"
          delay: "3m"
          value_type: "FLOAT"
          status: "DISABLED"
          tags:
            -
              tag: "component"
              value: "cpu"
      discovery_rules:
        -
          uuid: "aa797e5135f14d5c8edd43c323ba4f26"
          name: "Services discovery"
          type: "SNMP_AGENT"
          snmp_oid: "discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.1.1.1.2]"
