        tags:
        - tag: component
          value: interface-discards
      - uuid: 73ab847762e345edac8d26a7946e52d1
        name: 'Interface {#IFNAME}: description/alias'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.18.{#SNMPINDEX}]
        key: sp.dashboard.interface.alias[{#SNMPINDEX}]
        delay: 1h
        description: 'Optional IF-MIB metadata; disabled by default to avoid errors on unsupported virtual interfaces.'
        status: DISABLED
        value_type: CHAR
        trends: '0'
        tags:
