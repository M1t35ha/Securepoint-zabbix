      status: DISABLED
    - uuid: 91d0b02dd3d54321a135b75df34c8179
      name: 'OPTIONAL: configuration backup inventory'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.6.1.1.2]
      key: sp.mib.backup.discovery
