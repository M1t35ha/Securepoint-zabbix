    discovery_rules:
        -
          uuid: "aa797e5135f14d5c8edd43c323ba4f26"
          name: "Services discovery"
          type: "SNMP_AGENT"
          snmp_oid: "discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.1.1.1.2]"
          key: "sp.mib.service.discovery"
          delay: "1h"
          item_prototypes:
            -
              uuid: "b534d49d55294bf888ae2783e649f62e"
              name: "Service {#LABEL}: status"
              type: "SNMP_AGENT"
              snmp_oid: "get[1.3.6.1.4.1.28553.2.1.1.1.1.3.{#SNMPINDEX}]"
              key: "sp.mib.service.status[{#SNMPINDEX}]"
              delay: "5m"
              valuemap:
                name: "Securepoint application (MIB)"
              tags:
                -
                  tag: "component"
                  value: "service"
                -
                  tag: "name"
                  value: "{#LABEL}"
              trigger_prototypes:
                -
                  uuid: "c68ea82a64cc488b886ff8bcfda73565"
                  name: "UTM: required service {#LABEL} is down"
                  expression: "{$SP.SERVICE.ALERT:\"{#LABEL}\"}=1 and min(/Securepoint UTM Unified v5 by SNMP/sp.mib.service.status[{#SNMPINDEX}],10m)=2"
                  priority: "WARNING"
            -
              uuid: "7638c098a73c44ab8e04913e8c4f79c9"
              name: "Service {#LABEL}: flags (raw)"
              type: "SNMP_AGENT"
              snmp_oid: "get[1.3.6.1.4.1.28553.2.1.1.1.1.4.{#SNMPINDEX}]"
              key: "sp.mib.service.flags[{#SNMPINDEX}]"
              delay: "15m"
              description: "MIB appFlags; flags are NOT interpreted."
              tags:
                -
                  tag: "component"
                  value: "service"
                -
                  tag: "name"
                  value: "{#LABEL}"
        -
          uuid: "46ef2744bfa946e187d5ebee31d8c1cb"
          name: "IPsec tunnels discovery"
          type: "SNMP_AGENT"
          snmp_oid: "discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.2.1.1.2]"
          key: "sp.mib.ipsec.discovery"
          delay: "1h"
          item_prototypes:
            -
              uuid: "915017c6ed0746ef81f6ae94b88feda5"
              name: "IPsec {#LABEL}: status"
              type: "SNMP_AGENT"
              snmp_oid: "get[1.3.6.1.4.1.28553.2.1.2.1.1.3.{#SNMPINDEX}]"
              key: "sp.mib.ipsec.status[{#SNMPINDEX}]"
              delay: "5m"
              valuemap:
                name: "Securepoint IPsec (MIB)"
              tags:
                -
                  tag: "component"
                  value: "ipsec"
                -
                  tag: "name"
                  value: "{#LABEL}"
              trigger_prototypes:
                -
                  uuid: "591393b5b8f44b388a2668d7662dce7a"
                  name: "UTM: required IPsec {#LABEL} is down"
                  expression: "{$SP.IPSEC.ALERT:\"{#LABEL}\"}=1 and min(/Securepoint UTM Unified v5 by SNMP/sp.mib.ipsec.status[{#SNMPINDEX}],10m)=2"
                  priority: "WARNING"
            -
              uuid: "c21180045c844da38adc0a6e5b8888c5"
              name: "IPsec {#LABEL}: subnet count"
