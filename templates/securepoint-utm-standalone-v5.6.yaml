        - tag: item
          value: '{#LABEL}'
        valuemap:
          name: Securepoint OpenVPN (MIB)
      - uuid: 604eb284acea4920a2d00ad0c7142784
        name: 'OpenVPN {#LABEL}: connected clients'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.3.1.1.4.{#SNMPINDEX}]
        key: sp.mib.openvpn.clients[{#SNMPINDEX}]
        delay: 5m
        tags:
        - tag: component
          value: openvpn
        - tag: item
          value: '{#LABEL}'
      graph_prototypes:
      - uuid: d81bec0f3b44410ba5ff470301fb843f
        name: 'OpenVPN {#LABEL}: active client count'
        graph_items:
        - sortorder: '0'
          color: 1A7D33
          item:
            host: Securepoint UTM Standalone v5.6 by SNMP
            key: sp.mib.openvpn.clients[{#SNMPINDEX}]
    - uuid: 17a3f17107cc4c01a254428d4c6387cd
      name: 'UTM MIB: antivirus engines'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.5.1.1.2]
      key: sp.mib.av.discovery
      delay: 1h
      description: Manufacturer MIB table discovery; only creates items for returned rows.
      item_prototypes:
      - uuid: a68055de919849c2a528a3eece756d7a
        name: 'Antivirus {#LABEL}: last pattern update'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.5.1.1.3.{#SNMPINDEX}]
        key: sp.mib.av.lastupdate[{#SNMPINDEX}]
        delay: 30m
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: av
        - tag: item
          value: '{#LABEL}'
      - uuid: e0b703dab1b1436aa574815aeba6506a
        name: 'Antivirus {#LABEL}: last updater run'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.5.1.1.4.{#SNMPINDEX}]
        key: sp.mib.av.lastrun[{#SNMPINDEX}]
        delay: 30m
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: av
        - tag: item
          value: '{#LABEL}'
      - uuid: 4e6691d8246c4020a113c6e834e8c1f8
        name: 'Antivirus {#LABEL}: pattern update state'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.5.1.1.5.{#SNMPINDEX}]
        key: sp.mib.av.state[{#SNMPINDEX}]
        delay: 10m
        tags:
        - tag: component
          value: av
        - tag: item
          value: '{#LABEL}'
        valuemap:
          name: Securepoint antivirus update (MIB)
        trigger_prototypes:
        - uuid: d0c7716e62f545d6ad8f7fdee82177fe
          expression: '{$SP.AV.ALERT:"{#LABEL}"}=1 and min(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.av.state[{#SNMPINDEX}],20m)=2'
          name: 'UTM: antivirus {#LABEL} pattern update FAILED'
          priority: WARNING
          description: Opt in per active AV engine.
          tags:
          - tag: scope
            value: availability
    - uuid: 494809a5c5b2474dafcd98716830c1d1
      name: 'UTM MIB: WireGuard interfaces'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.11.1.1.2]
      key: sp.mib.wg.if.discovery
      delay: 1h
      description: Manufacturer MIB table discovery; only creates items for returned rows.
      item_prototypes:
      - uuid: e1b12d4bcde94453ac96779b6e32204b
        name: 'WireGuard {#LABEL}: configured tunnel name'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.1.1.3.{#SNMPINDEX}]
        key: sp.mib.wg.interface.tunnelname[{#SNMPINDEX}]
        delay: 30m
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
      - uuid: da847b142cb94ae0ac4adfc4414855c0
        name: 'WireGuard {#LABEL}: status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.11.1.1.4.{#SNMPINDEX}]
        key: sp.mib.wg.interface.status[{#SNMPINDEX}]
        delay: 5m
        tags:
        - tag: component
          value: wireguard
        - tag: item
          value: '{#LABEL}'
        valuemap:
          name: Securepoint WireGuard (MIB)
        trigger_prototypes:
        - uuid: bd56665039234680ade7e0d464907d0c
          expression: '{$SP.WG.ALERT:"{#LABEL}"}=1 and min(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.wg.interface.status[{#SNMPINDEX}],10m)=0'
          name: 'UTM: required WireGuard tunnel {#LABEL} disconnected'
