    - uuid: ab2942ea40a247aaaaf6aa960aefb64e
      name: 'Dashboard: interface throughput by IF-MIB (64-bit)'
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1]
      key: sp.dashboard.interface.discovery
      delay: 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFNAME}'
          value: '{$SP.DASHBOARD.IF.MATCHES}'
      description: Targeted IF-MIB dashboard discovery for traffic, link state/speed, errors and discards. Only 9 numeric fields per interface; no hrStorage/hrDevice scan. Source indexes come from ifName.
      item_prototypes:
      - uuid: 4a43da0c551a4cd8a71bf78444985c88
        name: 'Dashboard interface {#IFNAME}: received bits/s'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: sp.dashboard.interface.in.bps[{#SNMPINDEX}]
        delay: 3m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface-traffic
      - uuid: 5259941df3004f55af6b5881073d7b29
        name: 'Dashboard interface {#IFNAME}: transmitted bits/s'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: sp.dashboard.interface.out.bps[{#SNMPINDEX}]
        delay: 3m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface-traffic
      - uuid: 479bb618d9d046dca9c0923c480c4558
        name: 'Dashboard interface {#IFNAME}: operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: sp.dashboard.interface.oper.status[{#SNMPINDEX}]
        delay: 5m
        description: 'Targeted IF-MIB column; verify on device if not supported. Values from current interface index.'
        valuemap:
          name: Securepoint interface operational status
        tags:
        - tag: component
          value: interface-state
        trigger_prototypes:
        - uuid: 11142e0b071f4a51a8973067479cb001
          expression: '{$SP.IF.ALERT:"{#IFNAME}"}=1 and min(/Securepoint UTM Standalone v5.6 by SNMP/sp.dashboard.interface.oper.status[{#SNMPINDEX}],10m)<>1 and last(/Securepoint UTM Standalone v5.6 by SNMP/sp.dashboard.interface.admin.status[{#SNMPINDEX}])=1'
          name: 'Securepoint: {#IFNAME} is down while administratively enabled'
          priority: WARNING
          description: 'Opt in for always-on interfaces only; on-demand tunnels can be intentionally down.'
          tags:
          - tag: scope
            value: availability
      - uuid: 21fbf551bcd04c95adcde299ccee729d
        name: 'Dashboard interface {#IFNAME}: administrative status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: sp.dashboard.interface.admin.status[{#SNMPINDEX}]
        delay: 10m
        description: 'Targeted IF-MIB column; verify on device if not supported. Values from current interface index.'
        valuemap:
          name: Securepoint interface administrative status
        tags:
        - tag: component
          value: interface-state
      - uuid: 0e0b4b1c9c8248b0a8ecfe7c0bdda368
        name: 'Dashboard interface {#IFNAME}: link speed (Mbps)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}]
