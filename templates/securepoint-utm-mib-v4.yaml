        -
          uuid: "0efb357757df411689ed2a29ef6f6c08"
          name: "OPTIONAL: HA state"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.2.1.12.3.0]"
          key: "sp.mib.ha.state"
          delay: "10m"
          value_type: "CHAR"
          trends: "0"
          status: "DISABLED"
          tags:
            -
              tag: "component"
              value: "ha"
        -
          uuid: "48c63589ef1d4d3a8f852ed79ef152e0"
          name: "OPTIONAL: HA sync state"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.2.1.12.4.0]"
          key: "sp.mib.ha.sync"
          delay: "10m"
          value_type: "CHAR"
          trends: "0"
          status: "DISABLED"
          tags:
            -
              tag: "component"
              value: "ha"
        -
          uuid: "8ded1d95e09043a088617feb556305ce"
          name: "OPTIONAL: HA maintenance"
          type: "SNMP_AGENT"
          snmp_oid: "get[1.3.6.1.4.1.28553.2.1.12.5.0]"
