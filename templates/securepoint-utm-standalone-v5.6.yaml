      - type: CHANGE_PER_SECOND
      tags:
      - tag: component
        value: std
    - uuid: 60c732d29b5145e6a059443ed3c9e952
      name: 'Dashboard: CPU idle from UCD-SNMP (%)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.11.11.0]
      key: sp.dashboard.cpu.idle_pct
      delay: 5m
      units: '%'
      description: UCD-SNMP ssCpuIdle.0; optional capability depending on firmware.
      tags:
      - tag: component
        value: dashboard
    - uuid: e755277a1233464ea26d2a9a41618c6e
      name: 'Dashboard: CPU utilisation (%)'
      type: CALCULATED
      key: sp.dashboard.cpu.used_pct
      delay: 5m
      value_type: FLOAT
      params: 100-last(//sp.dashboard.cpu.idle_pct)
      units: '%'
      description: Optional dashboard-only derived metric. Requires both underlying UCD SNMP scalar items to be supported. Not a Securepoint vendor OID.
      tags:
      - tag: component
        value: dashboard
    - uuid: fd8c8a2bddf3448fadc156c7978be5d3
      name: 'Dashboard: total RAM from UCD-SNMP (KiB)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.5.0]
      key: sp.dashboard.mem.total_kib
      delay: 5m
      units: KiB
      description: UCD-SNMP memTotalReal.0; may be unsupported by firmware.
      tags:
      - tag: component
        value: dashboard
    - uuid: b12934fa839b429aa98ada7ab0558cba
      name: 'Dashboard: free RAM from UCD-SNMP (KiB)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.6.0]
      key: sp.dashboard.mem.free_kib
      delay: 5m
      units: KiB
      description: UCD-SNMP memAvailReal.0; cache counts as used in displayed occupancy.
      tags:
      - tag: component
        value: dashboard
    - uuid: f9170851dfba4451a0d0bce9e1f30d49
      name: 'Dashboard: physical RAM occupied, including cache (%)'
      type: CALCULATED
      key: sp.dashboard.mem.used_pct
      delay: 5m
      value_type: FLOAT
      params: 100*(last(//sp.dashboard.mem.total_kib)-last(//sp.dashboard.mem.free_kib))/(last(//sp.dashboard.mem.total_kib)+1)
      units: '%'
      description: Optional dashboard-only derived metric. Requires both underlying UCD SNMP scalar items to be supported. Not a Securepoint vendor OID.
      tags:
      - tag: component
        value: dashboard
    - uuid: 95305757adde4ecba92adec7f88643cb
      name: 'Dashboard: host uptime (system HR)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.25.1.1.0]
      key: sp.dashboard.uptime
      delay: 5m
      units: uptime
      description: hrSystemUptime TimeTicks; multiplied by 0.01 to seconds, may reset independently from interface uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: dashboard
      triggers:
      - uuid: e92e5c0cb0364ac4ab8663f450bb7e9c
        expression: '{$SP.SNMP.NODATA.ALERT}=1 and nodata(/Securepoint UTM Standalone v5.6 by SNMP/sp.dashboard.uptime,15m)=1'
        name: 'Securepoint: no SNMP uptime data for 15 minutes'
        priority: HIGH
        description: 'SNMP monitoring may be unavailable. Check firewall access, routing, SNMPv3 and device status.'
        tags:
        - tag: scope
          value: availability
    - uuid: ba26e216af7d4f4ea3f8f542154ded62
      name: 'Dashboard: firewall hostname'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: sp.dashboard.system.name
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: Standard MIB-II scalar; safe system identity fallback when optional vendor firmware OID is missing.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: dashboard
    - uuid: 783c6b0194084e05a3dd87214b0df795
      name: 'Dashboard: firewall system description'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: sp.dashboard.system.description
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: Standard MIB-II scalar; safe system identity fallback when optional vendor firmware OID is missing.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: dashboard
    - uuid: bd226db0781e4714a502993448199ef8
      name: 'System: SNMP object identifier'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: sp.core.system.objectid
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: 'sysObjectID.0 (standard SNMP system identity); no parent template required.'
      tags:
      - tag: component
        value: system
    - uuid: 065f57114eeb4733ad3100fde1f35a83
      name: 'System: SNMP agent uptime'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: sp.core.snmp.uptime
      delay: 5m
      units: uptime
      description: 'sysUpTime.0: SNMP agent time ticks. OS uptime is sp.dashboard.uptime.'
      tags:
      - tag: component
        value: system
    discovery_rules:
    - uuid: 27fb56b9a8c948e9aeab7719dfc07ec1
      name: 'UTM MIB: system services'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.1.1.1.2]
      key: sp.mib.service.discovery
      delay: 1h
      description: appStatusTable, auto-discovers service names and known states.
      item_prototypes:
      - uuid: 54ab3ac9eb3b4895a90a3bb5b73f0b91
        name: 'Service {#LABEL}: state'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.1.1.1.3.{#SNMPINDEX}]
        key: sp.mib.service.status[{#SNMPINDEX}]
        delay: 5m
        description: appStatus from official MIB.
        tags:
        - tag: component
          value: service
        - tag: item
          value: '{#LABEL}'
        valuemap:
          name: Securepoint application (MIB)
        trigger_prototypes:
        - uuid: 9f605ec4bce7405ca5b8add4cac71b04
          expression: '{$SP.SERVICE.ALERT:"{#LABEL}"}=1 and min(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.service.status[{#SNMPINDEX}],10m)=2'
          name: 'UTM: required service {#LABEL} is DOWN'
          priority: WARNING
          description: Opt in per service; status 2=Down, intentional disabled services should not be alerted.
          tags:
          - tag: scope
            value: availability
      - uuid: 4fcfaa1dbf6e46e1a9ba7cfdc5c0d341
        name: 'Service {#LABEL}: raw flags'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.1.1.1.4.{#SNMPINDEX}]
        key: sp.mib.service.flags[{#SNMPINDEX}]
        delay: 15m
        description: appFlags Unsigned32. Meaning of individual flags is not documented; no decoding.
        tags:
        - tag: component
          value: service
        - tag: item
          value: '{#LABEL}'
    - uuid: c07ac1cb5e004c3fa6f778379f25bc63
      name: 'UTM MIB: IPsec tunnels'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.2.1.1.2]
      key: sp.mib.ipsec.discovery
      delay: 1h
      description: ipsecStatusTable; status 0/1/2 mapped per manufacturer MIB.
      item_prototypes:
      - uuid: cc407224bfb34f80a541e3a4457411f8
        name: 'IPsec {#LABEL}: tunnel status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.2.1.1.3.{#SNMPINDEX}]
        key: sp.mib.ipsec.status[{#SNMPINDEX}]
        delay: 3m
        tags:
        - tag: component
          value: ipsec
        - tag: item
          value: '{#LABEL}'
        valuemap:
          name: Securepoint IPsec (MIB)
        trigger_prototypes:
        - uuid: 5348f97a4c304e2aa5336ceec95287ee
          expression: '{$SP.IPSEC.ALERT:"{#LABEL}"}=1 and min(/Securepoint UTM Standalone v5.6 by SNMP/sp.mib.ipsec.status[{#SNMPINDEX}],10m)=2'
          name: 'UTM: required IPsec {#LABEL} is DOWN'
          priority: WARNING
          description: Opt in per IPsec profile; on-demand profiles may correctly be down.
          tags:
          - tag: scope
            value: availability
      - uuid: 79c58eb3dad942fba9acc707c2a92d7f
        name: 'IPsec {#LABEL}: configured subnet count'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.2.1.1.4.{#SNMPINDEX}]
        key: sp.mib.ipsec.subnets[{#SNMPINDEX}]
        delay: 15m
        tags:
        - tag: component
          value: ipsec
        - tag: item
          value: '{#LABEL}'
    - uuid: 66e396ff06554fabac775f133098965f
      name: 'UTM MIB: OpenVPN profiles'
      type: SNMP_AGENT
      snmp_oid: discovery[{#LABEL},1.3.6.1.4.1.28553.2.1.3.1.1.2]
      key: sp.mib.openvpn.discovery
      delay: 1h
      description: openvpnStatusTable. Connection counts available; per-user session inventory not collected.
      item_prototypes:
      - uuid: ee7a0c3e17344fe6ad53155664b389f6
        name: 'OpenVPN {#LABEL}: status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.28553.2.1.3.1.1.3.{#SNMPINDEX}]
        key: sp.mib.openvpn.status[{#SNMPINDEX}]
